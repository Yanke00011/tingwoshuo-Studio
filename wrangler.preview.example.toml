# Preview uses isolated resources and still requires Cloudflare Access.
# Never reuse the production database or private media bucket for preview.
name = "tingwoshuo-studio-preview"
main = "src/worker.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[vars]
ENVIRONMENT = "production"
ACCESS_TEAM = "REPLACE_WITH_ZERO_TRUST_TEAM_NAME"
ACCESS_AUD = "REPLACE_WITH_PREVIEW_ACCESS_APPLICATION_AUD_TAG"
GITHUB_OWNER = "Yanke0001"
GITHUB_REPO = "tingwoshuo.github.io"
GITHUB_BASE_BRANCH = "main"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "tingwoshuo-studio-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "PRIVATE_MEDIA"
bucket_name = "REPLACE_WITH_PREVIEW_PRIVATE_BUCKET_NAME"
