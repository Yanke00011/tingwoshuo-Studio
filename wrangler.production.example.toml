# Copy to wrangler.toml after creating separate production D1 and R2 resources.
# Replace the two explicit resource placeholders with IDs/names from your account.
name = "tingwoshuo-studio"
main = "src/worker.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[vars]
ENVIRONMENT = "production"
ACCESS_TEAM = "REPLACE_WITH_ZERO_TRUST_TEAM_NAME"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG"
GITHUB_OWNER = "Yanke0001"
GITHUB_REPO = "tingwoshuo.github.io"
GITHUB_BASE_BRANCH = "main"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "tingwoshuo-studio-production"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "PRIVATE_MEDIA"
bucket_name = "REPLACE_WITH_REAL_PRIVATE_BUCKET_NAME"
