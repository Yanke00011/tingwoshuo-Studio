name = "tingwoshuo-studio-staging"
main = "src/worker.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[vars]
ENVIRONMENT = "staging"
CONTENT_BACKEND = "d1"
ACCESS_TEAM = "REPLACE_WITH_ACCESS_TEAM_NAME"
ACCESS_AUD = "REPLACE_WITH_STAGING_ACCESS_APPLICATION_AUD"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "tingwoshuo-studio-v7-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRIVATE_MEDIA"
bucket_name = "tingwoshuo-v7-staging-media"
