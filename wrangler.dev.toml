name = "tingwoshuo-studio-local"
main = "src/worker.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[vars]
ENVIRONMENT = "development"
LOCAL_DEV_EMAIL = "you@local.invalid"
GITHUB_OWNER = "Yanke00011"
GITHUB_REPO = "tingwoshuo.github.io"
GITHUB_BASE_BRANCH = "main"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "tingwoshuo-studio-local"
database_id = "local-development-db"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "PRIVATE_MEDIA"
bucket_name = "tingwoshuo-studio-local"
